databases:
  - name: prisma-v2-db
    databaseName: prisma_v2
    user: prisma_v2
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: prisma-v2-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    branch: main
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - alembic.ini
        - pyproject.toml
        - uv.lock
        - Dockerfile.backend
        - scripts/backend-start.sh
        - scripts/seed_admin.py
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prisma-v2-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://prisma-v2-frontend.onrender.com
      - key: PYTHONPATH
        value: /app
      - key: SENDGRID_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: TOOL_API_KEY
        sync: false
      - key: APP_VERSION
        value: "2.1.0"
      # JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD: manuell im Render-Dashboard setzen.

  - type: web
    name: prisma-v2-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    branch: main
    plan: free
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://prisma-v2-backend.onrender.com
      - key: NEXT_PUBLIC_API_KEY
        sync: false
    buildFilter:
      paths:
        - frontend/**
        - Dockerfile.frontend
        - render.yaml

  - type: cron
    name: prisma-news-ingestion
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    branch: main
    schedule: "0 6 * * *"
    dockerCommand: python -m backend.application.services.news_ingestion_service
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prisma-v2-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

  - type: cron
    name: prisma-crypto-daily
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    branch: main
    schedule: "30 6 * * *"
    dockerCommand: python -m backend.scripts.crypto_daily_snapshot
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prisma-v2-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false

  - type: cron
    name: prisma-smi-market-caps
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    branch: main
    schedule: "0 5 * * *"
    dockerCommand: python scripts/update_smi_market_caps.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prisma-v2-db
          property: connectionString

  - type: cron
    name: prisma-stock-daily
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    branch: main
    schedule: "0 7 * * *"
    dockerCommand: python -m backend.scripts.stock_daily_snapshot
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prisma-v2-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
